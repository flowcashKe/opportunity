<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Test</title>

<style>

body{
    font-family: Arial;
    text-align:center;
    padding-top:100px;
    background:#f5f5f5;
}

button{
    padding:15px 30px;
    font-size:18px;
    cursor:pointer;
}

#paymentStatus{
    margin-top:30px;
    font-size:24px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>PalPluss Payment</h1>

<button onclick="pay()">
Pay Now
</button>

<div id="paymentStatus">
⏳ Waiting for payment...
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>

// =======================================
// FIREBASE CONFIG
// =======================================

const firebaseConfig = {

    apiKey: "AIzaSyCk65nRivNLguq_Tt8Tl3hea5YfOg44gz8",

    authDomain: "calculator-85416.firebaseapp.com",

    databaseURL:
    "https://calculator-85416-default-rtdb.firebaseio.com",

    projectId: "calculator-85416",

    storageBucket:
    "calculator-85416.firebasestorage.app",

    messagingSenderId: "288130866574",

    appId:
    "1:288130866574:web:98f046172bc05c8dc618df"

};

// =======================================
// INIT FIREBASE
// =======================================

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

// =======================================
// PAYMENT BUTTON
// =======================================

function pay(){

    window.open(
        "https://link.palpluss.com/6aa649f0-b962-451b-8cc6-6edd5377b440",
        "_blank"
    );

}

// =======================================
// LISTEN FOR PAYMENT STATUS
// =======================================

const statusElement =
document.getElementById("paymentStatus");

const paymentRef =
database.ref("payments/globalStatus");

paymentRef.on("value", (snapshot) => {

    const data = snapshot.val();

    if(!data) return;

    console.log(data);

    if(data.status === "PAID"){

        statusElement.innerHTML =
        "✅ Payment Successful";

        localStorage.setItem(
            "payment_status",
            "PAID"
        );

    }

    else if(data.status === "FAILED"){

        statusElement.innerHTML =
        "❌ Payment Failed";

    }

    else if(data.status === "CANCELLED"){

        statusElement.innerHTML =
        "❌ Payment Cancelled";

    }

    else if(data.status === "EXPIRED"){

        statusElement.innerHTML =
        "⌛ Payment Expired";

    }

});

</script>

</body>
</html>
